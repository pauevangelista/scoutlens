<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ScoutLens your details</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #2B50FF;outline-offset:2px}
</style>
</helmet>
<div style="width:390px;height:900px;box-sizing:border-box;background:#F3F4F7;color:#0F1115;font-family:'Hanken Grotesk','Helvetica Neue',system-ui,sans-serif;padding:20px 24px 28px;display:flex;flex-direction:column">

  <div style="display:flex;align-items:center;gap:14px">
    <a href="Experience.dc.html" aria-label="Back" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid #DADDE5;border-radius:999px;background:#FFFFFF;flex:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0F1115" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 L8 12 L15 19"/></svg></a>
    <div style="flex:1;height:4px;border-radius:2px;background:#DADDE5"><div style="width:80%;height:100%;border-radius:2px;background:#2B50FF"></div></div>
    <div style="font-size:13px;color:#5A6070;font-weight:500">4 of 5</div>
  </div>

  <h1 style="margin:40px 0 0;font-size:38px;font-weight:800;line-height:1.04;letter-spacing:-0.035em">Your details</h1>
  <p style="margin:12px 0 0;font-size:17px;line-height:1.5;color:#5A6070">Agencies ask for these. We never ask for your weight.</p>

  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px;margin-top:26px">
    <div>
      <label for="h" style="display:block;font-size:14px;font-weight:600;margin-bottom:6px">Height (cm)</label>
      <input id="h" type="text" inputmode="decimal" value="176" style="box-sizing:border-box;width:100%;height:52px;padding:0 16px;font:inherit;font-size:17px;color:#0F1115;background:#FFFFFF;border:1px solid #C5C9D4;border-radius:16px">
    </div>
    <div>
      <label for="age" style="display:block;font-size:14px;font-weight:600;margin-bottom:6px">Age</label>
      <input id="age" type="text" inputmode="numeric" value="21" style="box-sizing:border-box;width:100%;height:52px;padding:0 16px;font:inherit;font-size:17px;color:#0F1115;background:#FFFFFF;border:1px solid #C5C9D4;border-radius:16px">
    </div>
    <div style="grid-column:1 / span 2">
      <label for="city" style="display:block;font-size:14px;font-weight:600;margin-bottom:6px">City or country</label>
      <input id="city" type="text" value="Madrid, Spain" style="box-sizing:border-box;width:100%;height:52px;padding:0 16px;font:inherit;font-size:17px;color:#0F1115;background:#FFFFFF;border:1px solid #C5C9D4;border-radius:16px">
    </div>
  </div>

  <div style="display:flex;align-items:baseline;justify-content:space-between;margin-top:32px">
    <h2 style="margin:0;font-size:22px;font-weight:800;letter-spacing:-0.025em">Measurements</h2>
    <div style="font-size:14px;color:#5A6070">Optional</div>
  </div>
  <p style="margin:6px 0 0;font-size:15px;line-height:1.45;color:#5A6070">For your model card. We only show them back to you.</p>

  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px;margin-top:16px">
    <div>
      <label for="chest" style="display:block;font-size:14px;font-weight:600;margin-bottom:6px">Chest or bust (cm)</label>
      <input id="chest" type="text" inputmode="decimal" value="84" style="box-sizing:border-box;width:100%;height:52px;padding:0 16px;font:inherit;font-size:17px;color:#0F1115;background:#FFFFFF;border:1px solid #C5C9D4;border-radius:16px">
    </div>
    <div>
      <label for="waist" style="display:block;font-size:14px;font-weight:600;margin-bottom:6px">Waist (cm)</label>
      <input id="waist" type="text" inputmode="decimal" value="66" style="box-sizing:border-box;width:100%;height:52px;padding:0 16px;font:inherit;font-size:17px;color:#0F1115;background:#FFFFFF;border:1px solid #C5C9D4;border-radius:16px">
    </div>
    <div>
      <label for="hips" style="display:block;font-size:14px;font-weight:600;margin-bottom:6px">Hips (cm)</label>
      <input id="hips" type="text" inputmode="decimal" value="90" style="box-sizing:border-box;width:100%;height:52px;padding:0 16px;font:inherit;font-size:17px;color:#0F1115;background:#FFFFFF;border:1px solid #C5C9D4;border-radius:16px">
    </div>
    <div>
      <label for="shoe" style="display:block;font-size:14px;font-weight:600;margin-bottom:6px">Shoe size (EU)</label>
      <input id="shoe" type="text" inputmode="decimal" placeholder="e.g. 40" style="box-sizing:border-box;width:100%;height:52px;padding:0 16px;font:inherit;font-size:17px;color:#0F1115;background:#FFFFFF;border:1px solid #C5C9D4;border-radius:16px">
    </div>
  </div>

  <div style="flex:1"></div>

  <a href="Digitals.dc.html" style="display:flex;align-items:center;justify-content:center;height:56px;margin-top:28px;border-radius:999px;background:#0F1115;color:#FFFFFF;font-size:17px;font-weight:600">Continue</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
