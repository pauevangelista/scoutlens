<div style="width:390px;height:844px;box-sizing:border-box;background:#F3F4F7;color:#0F1115;font-family:'Hanken Grotesk','Helvetica Neue',system-ui,sans-serif;padding:20px 24px 28px;display:flex;flex-direction:column">

  </div>

  <h1 style="margin:40px 0 0;font-size:38px;font-weight:800;line-height:1.04;letter-spacing:-0.035em">Before we start</h1>
  <p style="margin:12px 0 0;font-size:17px;line-height:1.5;color:#5A6070">Three quick confirmations, so you know exactly what this is.</p>

  <div style="margin-top:28px;background:#FFFFFF;border:1px solid #DADDE5;border-radius:24px;padding:4px 20px">
    <div style="display:flex;gap:16px;align-items:flex-start;padding:20px 0;border-bottom:1px solid #E7EAF3">
      <input type="checkbox" id="c18" checked style="width:24px;height:24px;margin:0;flex:none;accent-color:#2B50FF">
      <label for="c18" style="font-size:17px;line-height:1.45;font-weight:600">I'm 18 or older.</label>
    </div>
    <div style="display:flex;gap:16px;align-items:flex-start;padding:20px 0;border-bottom:1px solid #E7EAF3">
      <input type="checkbox" id="cdev" checked style="width:24px;height:24px;margin:0;flex:none;accent-color:#2B50FF">
      <label for="cdev" style="font-size:16px;line-height:1.5">My photos stay on my device in this first version. Nothing is uploaded, and closing the page deletes everything.</label>
    </div>
    <div style="display:flex;gap:16px;align-items:flex-start;padding:20px 0">
      <input type="checkbox" id="cfeed" checked style="width:24px;height:24px;margin:0;flex:none;accent-color:#2B50FF">
      <label for="cfeed" style="font-size:16px;line-height:1.5">ScoutLens gives feedback on photos and details. It doesn't judge how I look.</label>
    </div>
  </div>

  <p style="margin:20px 0 0;font-size:14px;line-height:1.55;color:#5A6070"><strong style="font-weight:600;color:#0F1115">Later, one optional question.</strong> If you share your gender or age band, it is only used to check that ScoutLens treats everyone the same. It never changes your feedback.</p>

  <div style="flex:1"></div>
